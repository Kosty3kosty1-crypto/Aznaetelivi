name: Daily Telegram Fact Post

on:
  schedule:
    # 06:00 UTC = 09:00 по Москве (Россия не переходит на летнее время,
    # смещение UTC+3 постоянное, поэтому время можно не подстраивать)
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      fact_index:
        description: 'Номер факта для теста (0-62). Пусто = выбор по сегодняшней дате.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt

      - name: Опубликовать пост
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          FACT_INDEX: ${{ inputs.fact_index }}
        run: python post.py

      - name: Закоммитить лог
        run: |
          git config user.name "daily-fact-bot"
          git config user.email "actions@github.com"
          git add log.txt
          git diff --staged --quiet || git commit -m "log: пост за $(date -u +%Y-%m-%d)"
          git push
